<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2438">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Almaty Trip">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.svg">
<title>Almaty Trip · Colorful Route Planner</title>
<style>
:root{--navy:#0d2438;--blue:#2774a8;--sky:#dcecf6;--sand:#f4e5cc;--green:#476b55;--ink:#17222b;--muted:#71808b;--card:#fff;--bg:#f5f7f8;--line:#e4e9ed;--accent:#d8874c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",Arial,sans-serif}
button{font:inherit}a{color:inherit;text-decoration:none}.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:82px}
.hero{min-height:330px;padding:30px 20px 24px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(160deg,#173b58 0%,#2e6f89 46%,#b7d2d4 100%)}
.hero:after{content:"";position:absolute;inset:auto -10% -40px -10%;height:150px;background:rgba(255,255,255,.12);border-radius:50% 50% 0 0}
.kicker{font-size:12px;letter-spacing:2px;opacity:.86}.hero h1{font-size:38px;line-height:1.02;margin:10px 0 5px;letter-spacing:-1.5px}.hero p{margin:0;color:#e9f4f8}.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px;position:relative;z-index:2}.stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:13px}.stat b{display:block;font-size:18px}.stat small{opacity:.8}
.content{padding:16px}.section-title{font-size:20px;font-weight:800;margin:6px 2px 12px}.sub{font-size:12px;color:var(--muted);margin:-5px 2px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:10px 0;overflow:hidden;box-shadow:0 5px 18px rgba(20,40,55,.05)}
.card-pad{padding:15px}.photo{height:150px;background-size:cover;background-position:center;position:relative}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.48))}
.photo-label{position:absolute;left:14px;bottom:12px;color:#fff;font-size:20px;font-weight:800;z-index:1}
.day{border-left:4px solid var(--blue)}.day-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 15px;background:#f8fbfd}.day-head b{font-size:18px}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:var(--sky);color:#24536d;font-weight:700}
.timeline{padding:4px 15px 14px}.item{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}.item:last-child{border:0}.time{font-weight:800;color:var(--blue);font-size:13px}.item-title{font-weight:750}.item-note{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.flight{background:linear-gradient(145deg,#f8fbfd,#eaf3f8)}.flight .route{display:flex;align-items:center;justify-content:space-between;gap:8px}.airport{text-align:center}.airport strong{display:block;font-size:26px}.airport small{color:var(--muted)}.flightline{flex:1;text-align:center;color:var(--blue);font-size:12px}.flightline b{display:block}.transfer{text-align:center;background:#fff8e8;color:#88601f;padding:9px;border-top:1px dashed #ecd8a7;border-bottom:1px dashed #ecd8a7;font-size:12px}
.place-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.place .photo{height:125px}.place h3{margin:0;font-size:16px}.place p{margin:5px 0 0;font-size:11px;color:var(--muted);line-height:1.4}
.route-list{position:relative;padding-left:22px}.route-list:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:#c8dbe5}.route-stop{position:relative;padding:0 0 18px 18px}.route-stop:before{content:"";position:absolute;left:-19px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:3px solid var(--bg)}.route-stop b{display:block}.route-stop span{font-size:11px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.check input{width:20px;height:20px;accent-color:var(--green)}.check.done label{text-decoration:line-through;color:#98a2a8}
.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.bar:last-child{border:0}.bar b{font-size:15px}.tag{font-size:10px;background:#f1e7df;color:#7a4b2b;padding:5px 8px;border-radius:999px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:10px 12px;background:var(--navy);color:#fff;font-weight:700;font-size:12px}.btn.light{background:#eef5f8;color:#31596c}
.install{display:none;margin:10px 0;padding:14px;border-radius:16px;background:#e8f3f7;border:1px solid #c9e0e8}.install.show{display:block}.install b{display:block;margin-bottom:5px}.install button{margin-top:9px}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.bottom{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:72px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.nav{border:0;background:none;color:#89949c;font-size:10px;font-weight:700}.nav span{display:block;font-size:20px;line-height:25px}.nav.active{color:var(--blue)}
@media(min-width:521px){body{padding:20px 0}.app{border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.12)}.bottom{bottom:20px;border-radius:0 0 28px 28px}}

/* v7 route map and polish */
.route-map{margin:12px 0 16px;border-radius:20px;overflow:hidden;border:1px solid #dceaf0;background:linear-gradient(135deg,#eaf8ff,#fff7e9);box-shadow:0 8px 24px rgba(16,42,67,.07)}
.route-map-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 8px}.route-map-head b{font-size:13px}.route-map-head small{font-size:10px;color:#71808b}
.route-map-body{padding:8px 14px 14px}.route-stops{display:flex;align-items:center;gap:5px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}.route-stops .stop{flex:0 0 auto;border:1px solid #cde2eb;background:#fff;border-radius:11px;padding:8px 9px;font-size:10px;font-weight:800;color:#24536d;max-width:150px}.route-stops .arrow{flex:0 0 auto;color:#f28b42;font-weight:900}.map-actions{display:flex;gap:8px;flex-wrap:wrap}.map-actions .btn{font-size:11px;padding:10px 12px}.map-note{font-size:10px;line-height:1.5;color:#71808b;margin-top:8px}
.place .photo{background-color:#8bd6e8}.photo img{width:100%;height:100%;object-fit:cover;display:block}.place .photo img{position:absolute;inset:0}.home-gallery .g{background-color:#8bd6e8}.pack-progress{height:7px;background:#edf2f4;border-radius:99px;overflow:hidden;margin:8px 0 12px}.pack-progress i{display:block;height:100%;background:linear-gradient(90deg,#17a5c2,#ff9a3c);border-radius:99px}.pack-group{font-size:12px;font-weight:900;color:#1687a2;margin:16px 0 4px}.section-intro{border-radius:18px;padding:15px;background:linear-gradient(120deg,#e7f8ff,#fff1dd);margin:8px 0 14px;font-size:12px;line-height:1.6;color:#31596c}
@media(min-width:521px){.content{padding-bottom:110px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="bottom" id="nav">
<button class="nav active" data-tab="home"><span>🏠</span>홈</button>
<button class="nav" data-tab="schedule"><span>📅</span>일정</button>
<button class="nav" data-tab="places"><span>🏞️</span>여행지</button>
<button class="nav" data-tab="flight"><span>✈️</span>항공편</button>
<button class="nav" data-tab="packing"><span>🎒</span>준비물</button>
</nav>
<script src="data.js"></script><script src="app.js"></script>
</body>
</html>
