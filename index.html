$("#plan").onclick=e=>{let c=e.target.closest("[data-day]");if(c){day=+c.dataset.day;S.day=day;S.edit=null;save("S",S);plan();return}if(e.target.closest("[data-add]")){S.edit={i:null,x:null};plan();return}const ed=e.target.closest("[data-edit]");if(ed){const i=+ed.dataset.edit;S.edit={i,x:getDay().items[i].slice()};plan();return}if(e.target.closest("#cancel")){S.edit=null;plan();return}if(e.target.closest("[data-prev]")){day--;S.day=day;save("S",S);plan();return}if(e.target.closest("[data-next]")){day++;S.day=day;save("S",S);plan();return}const row=e.target.closest("[data-i]");if(row&&!e.target.closest("button")){const k=day+"-"+row.dataset.i;S.done[k]=!S.done[k];save("S",S);plan()}};$("#plan").addEventListener("submit",e=>{if(e.target.id!=="ef")return;e.preventDefault();const f=new FormData(e.target),x=[f.get("time"),f.get("title"),f.get("place"),f.get("note")];if(S.edit.i==null){const arr=getDay().items;arr.push(x);S.edits[day+"-new-"+Date.now()]=x}else{S.edits[day+"-"+S.edit.i]=x}S.edit=null;save("S",S);plan()});
function flights(){const F=TRIP.flights;$("#flight").innerHTML=`<div class="section"><h2>✈️ Flight Journey</h2><small>항공 & 이동</small></div>${F.map((f,i)=>`<div class="flight"><b>${f[0]}</b> · ${f[1]}<div class="route"><div><div class="code">${f[2]}</div>${f[3]}<br><b>${f[4]}</b></div><strong>→</strong><div style="text-align:right"><div class="code">${f[5]}</div>${f[6]}<br><b>${f[7]}</b></div></div><small>${f[8]}</small></div>${i==0?'<div class="lay">췸켄트 경유 · 4시간</div>':i==1?'<div class="lay">알마티 도착 · T1</div>':i==2?'<div class="lay">췸켄트 경유 · 5시간 50분</div>':""}`).join("")}`};
function map(){const names=["시내 구경","메데우 · 쉼블락 · 콕토베","알틴에멜 → 바씨","콜사이 · 카인디 · 차른","사티 → 알마티","빅알마티호수 · 쇼핑","알마티 → 인천"],pts=[[60,190],[90,170],[250,90],[290,230],[220,260],[65,235],[330,80]],paths=TRIP.days.map((d,i)=>i==0||i==6?"":`<path d="M${pts[i][0]} ${pts[i][1]} Q ${(pts[i][0]+pts[i+1][0])/2} ${(pts[i][1]+pts[i+1][1])/2-20} ${pts[i+1][0]} ${pts[i+1][1]}" fill="none" stroke="${d.color}" stroke-width="4" stroke-dasharray="7 6"/>`).join(""),pins=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="${TRIP.days[i].color}" stroke="white" stroke-width="3"/><text x="${p[0]}" y="${p[1]-11}" text-anchor="middle" font-size="10" font-weight="700">${i+1}</text>`).join("");$("#map").innerHTML=`<div class="section"><h2>🗺️ 여행 루트 한눈에</h2><small>전체 루트</small></div><div class="map"><svg viewBox="0 0 360 300"><rect width="360" height="300" fill="#f7f9fc"/><path d="M0 250L60 215 100 235 145 205 190 240 240 210 300 235 360 210V300H0Z" fill="#dce8f3"/>${paths}${pins}</svg><div class="mapBtns">${names.map((x,i)=>`<button>${i+1} · ${x}</button>`).join("")}</div></div>`};
function reco(){const h=TRIP.recos.map(g=>`<div class="reco" style="--rc:${g[1]}"><h3>${g[0]}</h3>${g[2].map(x=>`<div class="recrow"><b>${x[0]}</b><span>${x[1]}<small style="display:block;color:#8997aa">${x[2]}</small></span></div>`).join("")}</div>`).join("");$("#reco").innerHTML=`<div class="section"><h2>✦ 추천 맛집 · 바 · 쇼핑</h2></div>${h}`};
function pack(){const groups=[...TRIP.packing,["내가 추가한 것",S.customPack]],all=groups.flatMap(g=>g[1].map(x=>g[0]+"|"+x)),c=all.filter(k=>S.pack[k]).length;$("#pack").innerHTML=`<div class="section"><h2>🎒 준비물 체크리스트</h2><small>${c}/${all.length} 준비 완료</small></div>${groups.map(g=>`<div class="pack"><b>${g[0]}</b>${g[1].map(x=>{const k=g[0]+"|"+x;return`<label class="check"><input type="checkbox" data-p="${esc(k)}" ${S.pack[k]?"checked":""}>${esc(x)}</label>`}).join("")}${g[0]==="내가 추가한 것"?`<form class="addrow"><input id="newp" placeholder="준비물 추가"><button>추가</button></form>`:""}</div>`).join("")}`};$("#pack").onchange=e=>{if(e.target.dataset.p){S.pack[e.target.dataset.p]=e.target.checked;save("S",S);pack()}};$("#pack").onsubmit=e=>{e.preventDefault();const v=$("#newp").value.trim();if(v&&!S.customPack.includes(v)){S.customPack.push(v);save("S",S);pack()}};tabs();plan();flights();map();reco();pack();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{}))}</script></body></html>
